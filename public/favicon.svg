<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Black hole — Alex Tianyou Liu</title>
  <defs>
    <linearGradient id="violet" x1="21" y1="5" x2="43" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6d28d9"/>
      <stop offset=".48" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gold" x1="5" y1="29" x2="59" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ea7a1c"/>
      <stop offset=".5" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rim" x1="32" y1="22" x2="32" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Two perpendicular luminous orbits, simplified from the reference image. -->
  <ellipse cx="32" cy="32" rx="10.5" ry="27" stroke="url(#violet)" stroke-width="4.5"/>
  <ellipse cx="32" cy="35" rx="27" ry="9" stroke="url(#gold)" stroke-width="4.5"/>
  <circle cx="32" cy="32" r="10.5" fill="#0c0a15" stroke="url(#rim)" stroke-width="1.5"/>
  <!-- Foreground arcs cross in front of the event horizon. -->
  <path d="M5 35a27 9 0 0 0 54 0" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M32 5a10.5 27 0 0 1 0 54" stroke="url(#violet)" stroke-width="4.5" stroke-linecap="round"/>
</svg>
